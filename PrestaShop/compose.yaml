services:
#TIENDA

  tienda:
    image: prestashop/prestashop:8.2
    ports:
      - "${PUERTO:-8080}:80"
    environment:
      PS_INSTALL_AUTO: 1
      PS_LANGUAGE: es
      PS_COUNTRY: ES
      PS_DEMO_MODE: 0
      PS_DOMAIN: ${DIRECCION:?Falta DIRECCION en .env}:${PUERTO:-8080}
      PS_FOLDER_ADMIN: admin-tienda
      PS_FOLDER_INSTALL: install-tienda
      DB_SERVER: bd
      DB_NAME: ${BD_NOMBRE:-prestashop}
      DB_USER: ${BD_USUARIO:-prestashop}
      DB_PASSWD: ${BD_CONTRASENA:?Falta BD_CONTRASENA en .env}
      ADMIN_MAIL: ${ADMIN_CORREO:-admin@ejemplo.es}
      ADMIN_PASSWD: ${ADMIN_CONTRASENA:?Falta ADMIN_CONTRASENA en .env}
    volumes:
      - tienda_ficheros:/var/www/html
    depends_on:
      bd:
        condition: service_healthy
      correo:
        condition: service_started
    networks:
      - interna

#BASE DE DATOS
  bd:
    image: mariadb:11.8
    volumes: 
      - bd_datos:/var/lib/mysql
    environment:
      MARIADB_DATABASE: ${BD_NOMBRE:-prestashop}
      MARIADB_USER: ${BD_USUARIO:-prestashop}
      MARIADB_PASSWORD: ${BD_CONTRASENA:? Falta BD_CONTRASENA en .env}
      MARIADB_RANDOM_ROOT_PASSWORD: 1
    networks:
    - interna
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect" ,"--innodb_initialized"]
      interval: 5s     
      timeout: 3s        
      retries: 10        
      start_period: 30s 
    restart: unless-stopped
  
#CORREO
  correo:
    image: axllent/mailpit:v1.32
    ports: 
      - "${PUERTO_CORREO:-8025}:8025"
    networks:
    - interna
    restart: unless-stopped

  adminer:
    image: adminer:5
    ports: 
      - "${PUERTO_ADMINER:-8081}:8080"
    profiles: ["herramientas"]
    environment:
      ADMINER_DEFAULT_SERVER: bd
    depends_on:
      bd:
        condition: service_healthy
    networks:
      - interna
    restart: unless-stopped
    
volumes: 
  tienda_ficheros:
  bd_datos:
networks:
  interna:

